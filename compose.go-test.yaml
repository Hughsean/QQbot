# Dedicated synthetic infrastructure. Never merge this file into production Compose.
services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg17@sha256:3e8b3adfd27b5707128f60956f62a793c3c9326ea8cfaf0eab7adccb5d700b21
    environment:
      POSTGRES_DB: qq_time_agent_go_test
      POSTGRES_USER: synthetic_go_test
      POSTGRES_PASSWORD: synthetic-test-only
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synthetic_go_test -d qq_time_agent_go_test"]
      interval: 2s
      timeout: 3s
      retries: 20
