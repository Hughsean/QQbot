x-app-container-environment: &app-container-environment
  APP_CONTAINER: "true"
  APP_LISTEN_HOST: "0.0.0.0"
  APP_LISTEN_PORT: "${APP_LISTEN_PORT:-8000}"
  DATABASE_HOST: "postgres"
  DATABASE_PORT: "5432"
  OLLAMA_BASE_URL: "http://ollama:11434"
  ASSET_STORAGE_PATH: "/var/lib/qq-time-agent/assets"

x-app-service: &app-service
  image: qq-time-agent:local
  restart: unless-stopped
  env_file: .env
  environment: *app-container-environment
  volumes:
    - qq_time_agent_assets:/var/lib/qq-time-agent/assets
  depends_on:
    postgres:
      condition: service_healthy
    ollama-init:
      condition: service_completed_successfully
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg17@sha256:3e8b3adfd27b5707128f60956f62a793c3c9326ea8cfaf0eab7adccb5d700b21
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-qq_time_agent}
      POSTGRES_USER: ${DATABASE_USER:-qq_time_agent}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    ports:
      - "127.0.0.1:${DATABASE_PORT:-5432}:5432"
    volumes:
      - qq_time_agent_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  ollama:
    image: ollama/ollama@sha256:57d60e686821ea81a7748a3ec8141308c8b8f95b27105713954abf7a6529e700
    restart: unless-stopped
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_KEEP_ALIVE: "${OLLAMA_KEEP_ALIVE:-30m}"
    volumes:
      - qq_time_agent_ollama:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  ollama-init:
    image: ollama/ollama@sha256:57d60e686821ea81a7748a3ec8141308c8b8f95b27105713954abf7a6529e700
    restart: "no"
    environment:
      OLLAMA_HOST: "http://ollama:11434"
      OLLAMA_EMBEDDING_MODEL: "${OLLAMA_EMBEDDING_MODEL:-qwen3-embedding:4b}"
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["sh", "-c"]
    command:
      - >-
        if ollama list | awk 'NR > 1 {print $1}' | grep -Fxq "$${OLLAMA_EMBEDDING_MODEL}";
        then echo "Ollama model already present";
        else ollama pull "$${OLLAMA_EMBEDDING_MODEL}"; fi

  web:
    <<: *app-service
    build: .
    ports:
      - "127.0.0.1:${APP_LISTEN_PORT:-8000}:${APP_LISTEN_PORT:-8000}"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os,sys,urllib.request;p=os.environ['APP_LISTEN_PORT'];sys.exit(0 if urllib.request.urlopen(f'http://127.0.0.1:{p}/health/live',timeout=3).status==200 else 1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    <<: *app-service
    command: ["qq-time-agent-worker"]

  qq:
    <<: *app-service
    command: ["qq-time-agent-qq"]
    stop_grace_period: 20s

  migrate:
    <<: *app-service
    profiles: ["ops"]
    restart: "no"
    command: ["alembic", "upgrade", "head"]

  replay-tombstones:
    <<: *app-service
    profiles: ["ops"]
    restart: "no"
    command: ["qq-time-agent-replay-tombstones"]

  requeue-knowledge-jobs:
    <<: *app-service
    profiles: ["ops"]
    restart: "no"
    command: ["qq-time-agent-requeue-knowledge-jobs"]

volumes:
  qq_time_agent_postgres:
  qq_time_agent_assets:
  qq_time_agent_ollama:
