# Go migration development stack; isolated from the retained Python deployment.
name: qq-time-agent-go-dev

x-go-app: &go-app
  image: qq-time-agent:go-dev
  build: .
  restart: unless-stopped
  environment:
    APP_CONTAINER: "true"
    APP_LISTEN_HOST: "0.0.0.0"
    APP_LISTEN_PORT: "${APP_LISTEN_PORT:-8000}"
    DATABASE_HOST: "postgres"
    DATABASE_PORT: "5432"
    DATABASE_NAME: "${DATABASE_NAME:-qq_time_agent_go_dev}"
    DATABASE_USER: "${DATABASE_USER:-qq_time_agent}"
    DATABASE_PASSWORD: "${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}"
    OLLAMA_BASE_URL: "http://ollama:11434"
    OLLAMA_EMBEDDING_MODEL: "${OLLAMA_EMBEDDING_MODEL:-qwen3-embedding:4b}"
    RAG_EMBEDDING_DIMENSIONS: "1024"
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg17@sha256:3e8b3adfd27b5707128f60956f62a793c3c9326ea8cfaf0eab7adccb5d700b21
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${DATABASE_NAME:-qq_time_agent_go_dev}"
      POSTGRES_USER: "${DATABASE_USER:-qq_time_agent}"
      POSTGRES_PASSWORD: "${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}"
    ports:
      - "127.0.0.1:${DATABASE_PORT:-5432}:5432"
    volumes:
      - go_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  ollama:
    image: ollama/ollama@sha256:57d60e686821ea81a7748a3ec8141308c8b8f95b27105713954abf7a6529e700
    restart: unless-stopped
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
    volumes:
      - go_ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 20

  ollama-init:
    image: ollama/ollama@sha256:57d60e686821ea81a7748a3ec8141308c8b8f95b27105713954abf7a6529e700
    profiles: ["development"]
    environment:
      OLLAMA_HOST: "http://ollama:11434"
    depends_on:
      ollama:
        condition: service_healthy
    command: ["pull", "qwen3-embedding:4b"]

  web:
    <<: *go-app
    profiles: ["development"]
    ports:
      - "127.0.0.1:${APP_LISTEN_PORT:-8000}:${APP_LISTEN_PORT:-8000}"
    depends_on:
      postgres:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/qq-time-agent", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 5

  migrate:
    <<: *go-app
    profiles: ["ops"]
    restart: "no"
    command: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  go_postgres:
  go_ollama:
